<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RSVP Responses | Ahmed &amp; Maha</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --olive: #4a5434;
      --olive-2: #5d6a42;
      --cream: #f5ebe1;
      --paper: #faf4ee;
      --gold: #f5ebe1;
      --wine: #7c2a3e;
      --accent: #b8703c;
      --text: #3b2a2e;
      --muted: #8a7a76;
      --line: rgba(74, 84, 52, .16);
      --yes: #2F5A3F;
      --no: #b23a5b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: Montserrat, system-ui, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }
    .script { font-family: "Great Vibes", cursive; font-weight: 400 }
    .serif { font-family: "Cormorant Garamond", serif }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit }

    /* lock screen */
    .lock {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; background: radial-gradient(circle at 50% 0%, var(--olive-2), var(--olive) 70%);
    }
    .lock-card {
      width: 100%; max-width: 22rem; text-align: center; background: var(--paper);
      border-radius: 1.5rem; padding: 2.25rem 1.5rem; box-shadow: 0 30px 60px -30px rgba(0,0,0,.6);
      animation: pop .7s cubic-bezier(.2,1.4,.4,1) both;
    }
    .lock-seal {
      width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f3d78a, #c9962f 60%, #9c7020);
      display: flex; align-items: center; justify-content: center; color: #6b4a10; font-size: 1.6rem;
      box-shadow: 0 6px 14px -6px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.2);
    }
    .lock h1 { font-size: 2.6rem; color: var(--olive); line-height: 1 }
    .lock p { color: var(--muted); font-size: .85rem; margin: .5rem 0 1.5rem }
    .pin { display: flex; gap: .45rem; justify-content: center; margin-bottom: 1.25rem }
    .pin input {
      width: 2.6rem; height: 3.2rem; text-align: center; font-size: 1.4rem; border-radius: .75rem;
      border: 1.5px solid var(--line); background: #fff; color: var(--text); outline: none;
      font-family: "Cormorant Garamond", serif; font-weight: 600;
    }
    .pin input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(184,112,60,.15) }
    .shake { animation: shake .45s }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .8rem 1.4rem; border-radius: 999px; background: var(--olive); color: #fff;
      font-size: .8rem; letter-spacing: .15em; text-transform: uppercase; transition: transform .2s, opacity .2s;
    }
    .btn:hover { transform: translateY(-1px) }
    .btn:disabled { opacity: .55; cursor: default; transform: none }
    .btn-ghost { background: #fff; color: var(--olive); border: 1px solid var(--line) }
    .lock .btn { width: 100% }
    .err { color: var(--no); font-size: .8rem; min-height: 1.2rem; margin-top: .75rem }

    /* dashboard */
    .top {
      background: var(--olive); color: var(--gold); padding: 1.5rem 1rem 4.5rem; text-align: center;
    }
    .top h1 { font-size: 2.8rem; line-height: 1 }
    .top p { opacity: .75; font-size: .8rem; letter-spacing: .25em; text-transform: uppercase; margin-top: .4rem }
    .wrap { max-width: 64rem; margin: -3.5rem auto 0; padding: 0 1rem 3rem }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem }
    .stat {
      background: var(--paper); border-radius: 1.1rem; padding: 1rem; border: 1px solid var(--line);
      box-shadow: 0 10px 30px -20px rgba(0,0,0,.45); animation: rise .6s both;
    }
    .stat:nth-child(2) { animation-delay: .06s } .stat:nth-child(3) { animation-delay: .12s } .stat:nth-child(4) { animation-delay: .18s }
    .stat-label { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted) }
    .stat-num { font-family: "Cormorant Garamond", serif; font-size: 2.4rem; font-weight: 600; line-height: 1.1 }
    .stat-num.yes { color: var(--yes) } .stat-num.no { color: var(--no) } .stat-num.gold { color: var(--accent) }
    .bar { height: 6px; border-radius: 6px; background: rgba(178,58,91,.18); overflow: hidden; margin-top: .5rem }
    .bar > span { display: block; height: 100%; background: var(--yes); border-radius: 6px; transition: width 1s ease }

    .tools { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin: 1.5rem 0 1rem }
    .search {
      flex: 1 1 14rem; padding: .7rem 1rem; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; font: inherit; font-size: .9rem; outline: none; color: var(--text);
    }
    .search:focus { border-color: var(--accent) }
    .filters { display: flex; gap: .35rem }
    .chip {
      padding: .5rem .9rem; border-radius: 999px; font-size: .75rem; border: 1px solid var(--line); background: #fff;
    }
    .chip.on { background: var(--olive); color: #fff; border-color: var(--olive) }

    .list { display: grid; gap: .75rem }
    .row {
      background: #fff; border-radius: 1rem; padding: 1rem 1.1rem; border: 1px solid var(--line);
      display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .9rem; align-items: center;
      animation: rise .45s both;
    }
    .avatar {
      grid-row: span 2; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 1.2rem; color: #fff;
    }
    .name { font-family: "Cormorant Garamond", serif; font-size: 1.3rem; font-weight: 600; line-height: 1.15; word-break: break-word }
    .when { font-size: .7rem; color: var(--muted) }
    .badge {
      grid-row: span 2; justify-self: end; display: flex; flex-direction: column; align-items: center;
      padding: .35rem .7rem; border-radius: .8rem; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
    }
    .badge b { font-family: "Cormorant Garamond", serif; font-size: 1.4rem; letter-spacing: 0; line-height: 1 }
    .badge.yes { background: rgba(47,90,63,.1); color: var(--yes) }
    .badge.no { background: rgba(178,58,91,.1); color: var(--no) }
    .msg {
      grid-column: 1 / -1; margin-top: .6rem; padding: .7rem .9rem; border-radius: .75rem; background: var(--paper);
      font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.05rem; border-left: 3px solid var(--accent);
      white-space: pre-wrap; word-break: break-word;
    }
    .row-foot { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: .55rem }
    .del {
      display: inline-flex; align-items: center; gap: .35rem; padding: .4rem .85rem; border-radius: 999px;
      font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--no);
      border: 1px solid rgba(178,58,91,.3); background: #fff; transition: background .2s, color .2s;
    }
    .del svg { width: 14px; height: 14px }
    .del:hover:not(:disabled) { background: var(--no); color: #fff }
    .del:disabled { opacity: .6; cursor: default }
    .row.gone { transition: opacity .35s, transform .35s; opacity: 0; transform: translateX(30px) }
    .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; font-family: "Cormorant Garamond", serif; font-size: 1.3rem }
    .note { text-align: center; color: var(--muted); font-size: .7rem; margin-top: 2rem }
    .hidden { display: none !important }
    .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite }

    @media (min-width: 720px) {
      .stats { grid-template-columns: repeat(4, 1fr) }
      .top { padding: 2.5rem 1rem 5rem }
      .top h1 { font-size: 3.6rem }
    }
    @keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes shake { 20%, 60% { transform: translateX(-8px) } 40%, 80% { transform: translateX(8px) } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
  </style>
</head>
<body>
  <!-- Lock screen -->
  <section class="lock" id="lock">
    <form class="lock-card" id="lockForm" autocomplete="off">
      <div class="lock-seal">&#10086;</div>
      <h1 class="script">Ahmed &amp; Maha</h1>
      <p>Enter the passcode to view RSVP responses</p>
      <div class="pin" id="pin">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 1">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 5">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 6">
      </div>
      <button class="btn" id="unlockBtn" type="submit">Unlock</button>
      <div class="err" id="lockErr" role="alert"></div>
    </form>
  </section>

  <!-- Dashboard -->
  <main class="hidden" id="dash">
    <header class="top">
      <h1 class="script">RSVP Responses</h1>
      <p>Ahmed &amp; Maha &middot; 18 December 2026</p>
    </header>
    <div class="wrap">
      <div class="stats">
        <div class="stat"><div class="stat-label">Responses</div><div class="stat-num" id="sTotal">0</div></div>
        <div class="stat"><div class="stat-label">Attending</div><div class="stat-num yes" id="sYes">0</div>
          <div class="bar"><span id="sBar" style="width:0%"></span></div></div>
        <div class="stat"><div class="stat-label">Total guests</div><div class="stat-num gold" id="sGuests">0</div></div>
        <div class="stat"><div class="stat-label">Declined</div><div class="stat-num no" id="sNo">0</div></div>
      </div>

      <div class="tools">
        <input class="search" id="search" type="search" placeholder="Search by name or message">
        <div class="filters">
          <button class="chip on" data-f="all">All</button>
          <button class="chip" data-f="yes">Attending</button>
          <button class="chip" data-f="no">Declined</button>
        </div>
        <button class="btn btn-ghost" id="refresh" type="button">Refresh</button>
        <button class="btn" id="csv" type="button">Export CSV</button>
      </div>

      <div class="list" id="list"></div>
      <p class="note" id="updated"></p>
    </div>
  </main>

  <script>
    const FN_URL = "https://cwcsbydzseldbjtadbbu.supabase.co/functions/v1/get-rsvps";
    const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3Y3NieWR6c2VsZGJqdGFkYmJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTY5NjYsImV4cCI6MjEwMTA5Mjk2Nn0.QWNqAihPZNB1IXNtmgStQ8k_hIuSto0u5cU7KVOER4g";
    const KEY = "am-rsvp-pass";
    const $ = id => document.getElementById(id);
    const pins = [...document.querySelectorAll("#pin input")];
    let rows = [], filter = "all", passcode = "";

    const store = {
      get() { try { return sessionStorage.getItem(KEY) || "" } catch { return "" } },
      set(v) { try { sessionStorage.setItem(KEY, v) } catch {} },
      clear() { try { sessionStorage.removeItem(KEY) } catch {} }
    };

    // pin inputs
    pins.forEach((el, i) => {
      el.addEventListener("input", () => {
        el.value = el.value.replace(/\D/g, "").slice(-1);
        if (el.value && pins[i + 1]) pins[i + 1].focus();
        if (pins.every(p => p.value)) $("lockForm").requestSubmit();
      });
      el.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !el.value && pins[i - 1]) pins[i - 1].focus();
      });
      el.addEventListener("paste", e => {
        const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
        if (!d) return;
        e.preventDefault();
        pins.forEach((p, k) => p.value = d[k] || "");
        (pins[d.length] || pins[5]).focus();
        if (d.length === 6) $("lockForm").requestSubmit();
      });
    });

    async function fetchRows(code) {
      return (await callFn({ passcode: code })).data || [];
    }

    async function callFn(payload) {
      let res;
      try {
        res = await fetch(FN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
          body: JSON.stringify(payload)
        });
      } catch {
        throw new Error("Couldn't reach the server. Check your connection, or the get-rsvps function isn't set up in Supabase yet.");
      }
      let body = {};
      try { body = await res.json() } catch {}
      if (res.status === 401 && body.error === "Wrong passcode") throw Object.assign(new Error("Wrong passcode"), { code: 401 });
      if (res.status === 404) throw new Error("The get-rsvps function isn't set up in Supabase yet.");
      if (!res.ok) throw new Error(body.error || body.message || body.msg || ("Error " + res.status));
      return body;
    }

    async function unlock(code, silent) {
      const btn = $("unlockBtn");
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
      $("lockErr").textContent = "";
      try {
        rows = await fetchRows(code);
        passcode = code; store.set(code);
        $("lock").classList.add("hidden"); $("dash").classList.remove("hidden");
        render();
      } catch (e) {
        store.clear();
        if (!silent) {
          $("lockErr").textContent = e.message;
          $("pin").classList.remove("shake"); void $("pin").offsetWidth; $("pin").classList.add("shake");
          if (e.code === 401) { pins.forEach(p => p.value = ""); pins[0].focus() }
        }
      } finally {
        btn.disabled = false; btn.textContent = "Unlock";
      }
    }

    $("lockForm").addEventListener("submit", e => {
      e.preventDefault();
      const code = pins.map(p => p.value).join("");
      if (code.length < 6) { $("lockErr").textContent = "Enter all 6 digits"; return }
      unlock(code);
    });

    const guestsOf = r => r.attendance === "yes" ? (Number(r.number_of_guests) || 1) : 0;
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = d => { try { return new Date(d).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) } catch { return "" } };
    const palette = ["#2F5A3F", "#7FA97C", "#0E7A4D", "#D63384", "#F07BA7", "#b8703c", "#4a5434"];
    const colorFor = s => palette[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % palette.length];

    function countUp(el, to) {
      const from = Number(el.textContent) || 0, t0 = performance.now(), dur = 700;
      const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step) };
      requestAnimationFrame(step);
    }

    function render() {
      const yes = rows.filter(r => r.attendance === "yes"), no = rows.filter(r => r.attendance !== "yes");
      countUp($("sTotal"), rows.length);
      countUp($("sYes"), yes.length);
      countUp($("sNo"), no.length);
      countUp($("sGuests"), yes.reduce((a, r) => a + guestsOf(r), 0));
      $("sBar").style.width = rows.length ? (yes.length / rows.length * 100) + "%" : "0%";

      const q = $("search").value.trim().toLowerCase();
      const shown = rows.filter(r =>
        (filter === "all" || (filter === "yes" ? r.attendance === "yes" : r.attendance !== "yes")) &&
        (!q || (r.full_name || "").toLowerCase().includes(q) || (r.message || "").toLowerCase().includes(q)));

      $("list").innerHTML = shown.length ? shown.map((r, i) => {
        const y = r.attendance === "yes";
        return `<article class="row" style="animation-delay:${Math.min(i, 12) * 0.04}s">
          <div class="avatar" style="background:${colorFor(r.full_name)}">${esc((r.full_name || "?").trim().charAt(0).toUpperCase())}</div>
          <div class="name">${esc(r.full_name)}</div>
          <div class="badge ${y ? "yes" : "no"}">${y ? `<b>${guestsOf(r)}</b>${guestsOf(r) === 1 ? "guest" : "guests"}` : "<b>&#10005;</b>declined"}</div>
          <div class="when">${esc(fmt(r.created_at))}</div>
          ${r.message ? `<div class="msg">${esc(r.message)}</div>` : ""}
          <div class="row-foot"><button class="del" type="button" data-id="${esc(r.id)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>
            Delete</button></div>
        </article>`;
      }).join("") : `<div class="empty">${rows.length ? "No matching responses" : "No responses yet"}</div>`;

      $("updated").textContent = "Last updated " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }

    $("list").addEventListener("click", async e => {
      const btn = e.target.closest(".del");
      if (!btn) return;
      const id = btn.dataset.id, r = rows.find(x => x.id === id);
      if (!r || !confirm(`Delete the response from "${r.full_name}"?\nThis can't be undone.`)) return;
      btn.disabled = true; btn.textContent = "Deleting...";
      try {
        await callFn({ passcode, action: "delete", id });
        const card = btn.closest(".row");
        card.classList.add("gone");
        setTimeout(() => { rows = rows.filter(x => x.id !== id); render() }, 350);
      } catch (err) {
        alert("Couldn't delete: " + err.message);
        btn.disabled = false; btn.textContent = "Delete";
      }
    });

    $("search").addEventListener("input", render);
    document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
      filter = c.dataset.f; render();
    }));
    $("refresh").addEventListener("click", async () => {
      const b = $("refresh"); b.disabled = true; b.textContent = "Loading...";
      try { rows = await fetchRows(passcode); render() } catch (e) { alert(e.message) }
      finally { b.disabled = false; b.textContent = "Refresh" }
    });
    $("csv").addEventListener("click", () => {
      // prefix cells that Excel would treat as formulas
      const q = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"' };
      const lines = [["Name", "Attending", "Guests", "Message", "Submitted"].map(q).join(",")]
        .concat(rows.map(r => [r.full_name, r.attendance === "yes" ? "Yes" : "No", guestsOf(r), r.message, r.created_at].map(q).join(",")));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
      a.download = "ahmed-maha-rsvps.csv"; document.body.appendChild(a); a.click(); a.remove();
    });

    // auto-unlock within the same browser tab session
    const saved = store.get();
    if (saved) unlock(saved, true); else pins[0].focus();
  </script>
</body>
</html>
